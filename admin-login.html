<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Odyssey — Staff Sign In</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700;6..72,900&display=swap" rel="stylesheet" />
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/recaptcha-config.js"></script>
<script src="js/security-guard.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B1930;--panel:#ffffff;--text:#141C2B;--muted:#64708A;--border:rgba(20,44,79,.14);
  --primary:#142C4F;--accent:#0F7A6C;--gold:#C08A3E;--danger:#B23A48;
  --ff-head:"Newsreader",Georgia,serif;--ff-body:Manrope,system-ui,sans-serif;
}
body{
  font-family:var(--ff-body);min-height:100vh;color:var(--text);
  background:linear-gradient(160deg,#0B1930 0%,#142C4F 45%,#0F1F38 75%,#1B2F4D 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{background:var(--panel);border-radius:20px;width:100%;max-width:400px;padding:36px 32px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--ff-head);font-weight:900;font-size:15px}
.mark-text{font-family:var(--ff-head);font-size:19px;font-weight:900}
.mark-text span{display:block;font-family:var(--ff-body);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
h1{font-family:var(--ff-head);font-size:21px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:24px;line-height:1.6}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:800;color:var(--text);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
input{width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:10px;font-family:var(--ff-body);font-size:13.5px;color:var(--text);background:#F6F4EF;outline:none;transition:border-color .2s,box-shadow .2s;font-weight:500}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,44,79,.1);background:#fff}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:var(--muted);padding:0}
button.submit{width:100%;padding:13px;border-radius:999px;border:none;font-size:14.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--gold));cursor:pointer;margin-top:6px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 22px rgba(20,44,79,.35)}
button.submit:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(20,44,79,.45)}
button.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.notice{display:none;font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.5}
.notice.bad{display:block;background:#fff1f2;color:#9f1239}
.notice.good{display:block;background:#ecfdf5;color:#116149}
.foot{text-align:center;margin-top:20px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.6}
.foot a{color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <div class="mark-icon">O</div>
    <div class="mark-text">Odyssey<span>Staff Portal</span></div>
  </div>
  <h1>Admin sign in</h1>
  <p class="sub">This page is for Odyssey staff accounts only. If you're a student or instructor, please use the regular <a href="auth.html?mode=login" style="color:var(--primary);font-weight:700">sign-in page</a>.</p>

  <div class="notice" id="notice"></div>

  <form id="adminLoginForm">
    <div class="fg">
      <label for="a_email">Staff email</label>
      <input id="a_email" type="email" autocomplete="username" placeholder="you@odyssey.learn" required />
    </div>
    <div class="fg">
      <label for="a_pw">Password</label>
      <div class="pw-wrap">
        <input id="a_pw" type="password" autocomplete="current-password" placeholder="Your password" required />
        <button class="pw-toggle" type="button" onclick="togglePw()">👁</button>
      </div>
    </div>
    <button class="submit" type="submit" id="submitBtn">🔐 Sign in to admin portal</button>
  </form>

  <div class="foot">Access is restricted and every sign-in is logged.<br>Wrong page? <a href="index.html">Return to Odyssey</a></div>
</div>

<script>
function togglePw(){
  const el = document.getElementById('a_pw');
  el.type = el.type === 'password' ? 'text' : 'password';
}

function showNotice(message, type){
  const box = document.getElementById('notice');
  box.textContent = message;
  box.className = 'notice ' + type;
}

function setBusy(busy){
  const btn = document.getElementById('submitBtn');
  btn.disabled = busy;
  btn.textContent = busy ? 'Signing in...' : '🔐 Sign in to admin portal';
}

const STAFF_ROLES = ['admin', 'support', 'superuser'];

document.getElementById('adminLoginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('a_email').value.trim().toLowerCase();
  const password = document.getElementById('a_pw').value;

  if (!email || !password) {
    showNotice('Enter your staff email and password.', 'bad');
    return;
  }
  if (!window.OdysseySupabase?.isConfigured?.()) {
    showNotice('Supabase is not configured yet. Add your project keys in js/supabase-config.js.', 'bad');
    return;
  }

  setBusy(true);
  try {
    const guard = await OdysseySecurity.check(email, 'admin_login');
    if (!guard.allowed) { showNotice(guard.message, 'bad'); return; }

    const result = await OdysseySupabase.signIn(email, password);
    const role = result?.profile?.role;

    if (!STAFF_ROLES.includes(role)) {
      // Do not leave a session behind for a non-staff account that happened to
      // wander onto this page, and do not hint at the real reason - "wrong
      // password" and "not staff" should look the same from the outside.
      await OdysseySupabase.signOut();
      OdysseySecurity.record(email, 'failure');
      throw new Error('Invalid staff credentials.');
    }

    OdysseySecurity.record(email, 'success');
    showNotice('Signed in. Opening the admin portal…', 'good');
    setTimeout(() => { location.href = result.redirectTo || 'admin_dashboard.html'; }, 300);
  } catch (error) {
    OdysseySecurity.record(email, 'failure');
    showNotice(error?.message || 'Invalid staff credentials.', 'bad');
  } finally {
    setBusy(false);
  }
});
</script>
</body>
</html>
