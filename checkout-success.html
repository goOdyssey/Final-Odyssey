<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odyssey - Payment confirmed</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/odyssey-design-system.css" />
<script defer src="assets/odyssey-scroll-reveal.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-nav-v4.js?v=20260826-4" defer></script>
<style>
:root{--bg:#F6F4EF;--ink:#141C2B;--muted:#64708A;--navy:#142C4F;--teal:#0F7A6C;--gold:#C08A3E;--line:rgba(20,28,43,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
.card{max-width:480px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(15,23,42,.12);padding:40px 32px;text-align:center}
.badge{width:64px;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px}
.badge.ok{background:rgba(15,122,108,.14);color:var(--teal)}
.badge.wait{background:rgba(192,138,62,.16);color:var(--gold)}
.badge.err{background:rgba(178,58,72,.14);color:#B23A48}
h1{font-family:Newsreader,Georgia,serif;font-size:26px;margin:0 0 10px}
p{color:var(--muted);line-height:1.6;margin:0 0 22px;font-size:14.5px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-weight:800;text-decoration:none;font-size:14px}
.spinner{width:22px;height:22px;border:3px solid rgba(192,138,62,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
</style>
  <script src="js/observability.js" defer></script>
</head>
<body>
<div class="od-ambient" data-parallax aria-hidden="true"><span class="od-orb od-orb-1"></span><span class="od-orb od-orb-2"></span><span class="od-orb od-orb-3"></span></div>

<div class="card" id="statusCard" data-reveal="rise">
  <div class="badge wait" id="statusBadge"><div class="spinner"></div></div>
  <h1 id="statusTitle">Confirming your payment...</h1>
  <p id="statusBody">This usually takes just a second. Please don't close this tab.</p>
  <div id="statusActions"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const stripeSessionId = params.get('session_id');
const MAX_ATTEMPTS = 10;
const POLL_INTERVAL_MS = 1500;

function setState(kind, title, body, actionsHtml){
  statusBadge.className = 'badge ' + kind;
  statusBadge.innerHTML = kind === 'ok' ? '✓' : (kind === 'err' ? '✕' : '<div class="spinner"></div>');
  statusTitle.textContent = title;
  statusBody.textContent = body;
  statusActions.innerHTML = actionsHtml || '';
}

async function pollForConfirmation(){
  if(!stripeSessionId){
    setState('err', "We couldn't find your checkout session", 'If you completed a payment, check your email for a receipt and visit your student portal - your course may already be there.', '<a class="btn" href="student_portal.html">Go to My Courses</a>');
    return;
  }
  if(!window.OdysseySupabase?.isConfigured?.()){
    setState('err', 'Could not verify payment', 'Please log in and check your student portal directly.', '<a class="btn" href="auth.html?mode=login">Log in</a>');
    return;
  }
  const session = await OdysseySupabase.session();
  if(!session){
    setState('err', 'You are signed out', 'Please log back in - if your payment succeeded, your course will already be waiting for you.', '<a class="btn" href="auth.html?mode=login&redirect=student_portal.html">Log in</a>');
    return;
  }

  const sb = await OdysseySupabase.client();
  for(let attempt = 0; attempt < MAX_ATTEMPTS; attempt++){
    try{
      const { data } = await sb.from('checkout_sessions').select('status').eq('provider_checkout_id', stripeSessionId);
      if(data && data.length && data.every(row => row.status === 'completed')){
        setState('ok', "You're enrolled!", 'Payment confirmed. Your course is ready whenever you are.', '<a class="btn" href="student_portal.html">Start learning →</a>');
        return;
      }
    }catch(error){
      console.error('Could not check checkout status.', error);
    }
    await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
  }
  // Webhook may just be slow (or not configured yet in this deployment) -
  // don't tell the person their payment failed when it may well have
  // succeeded on Stripe's side.
  setState('wait', 'Still finishing up', "Your payment may have gone through - this can take a little longer than usual. Check your student portal in a moment, or contact support if your course doesn't appear soon.", '<a class="btn" href="student_portal.html">Check My Courses</a>');
}

pollForConfirmation();
</script>
</body>
</html>
